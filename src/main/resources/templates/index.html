<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ID System Console</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>System Directory Identification Matrix</h2>
        <a th:href="@{/profiles/new}" class="btn btn-primary">Add New Profile Entry</a>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Registration ID</th>
                <th>Full Name</th>
                <th>Department</th>
                <th>Classification Matrix</th>
                <th>Actions Matrix</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${profiles}">
                <td th:text="${p.registrationNumber}"></td>
                <td th:text="${p.fullName}"></td>
                <td th:text="${p.department}"></td>
                <td th:text="${p.type}"></td>
                <td>
                    <a th:href="@{/profiles/export/{id}(id=${p.id})}" class="btn btn-danger btn-sm">Download Card PDF</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
