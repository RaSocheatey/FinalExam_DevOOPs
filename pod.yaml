apiVersion: v1
kind: Pod
metadata:
  name: midterm-exam-pod
  labels:
    app: idcard-app
spec:
  containers:
    - name: web-server-container
      image: ubuntu:22.04
      ports:
        - containerPort: 8080
        - containerPort: 8443
        - containerPort: 2222
    - name: mysql-db-container
      image: mysql:8.0
      env:
        - name: MYSQL_ROOT_PASSWORD
          value: "Hello@123"
        - name: MYSQL_DATABASE
          value: "A-Ra_Socheatey-db"
      ports:
        - containerPort: 3306